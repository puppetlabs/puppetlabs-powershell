---
plugins:
- rubocop-performance
- rubocop-hash_inspect
- rubocop-rspec
- rubocop-rspec_rails
- rubocop-factory_bot
- rubocop-capybara
AllCops:
  NewCops: disable
  DisplayCopNames: true
  TargetRubyVersion: 3.1
  Include:
  - "**/*.rb"
  Exclude:
  - bin/*
  - ".vendor/**/*"
  - "**/Gemfile"
  - "**/Rakefile"
  - pkg/**/*
  - spec/fixtures/**/*
  - vendor/**/*
  - "**/Puppetfile"
  - "**/Vagrantfile"
  - "**/Guardfile"
  DisabledByDefault: true
inherit_from: ".rubocop_todo.yml"
inherit_mode:
  merge:
  - Exclude
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/SpecFilePathSuffix:
  Enabled: false
