---
".gitlab-ci.yml":
  delete: true
".rubocop.yml":
  selected_profile: false
  include_todos: true
  # cop settings the module set by hand (MODULES-11997 pdk update)
  cop_overrides:
    RSpec/SpecFilePathFormat:
      Enabled: false
    RSpec/SpecFilePathSuffix:
      Enabled: false
appveyor.yml:
  delete: true
Gemfile:
  optional:
    ":development":
    - gem: ruby-pwsh
  overrides:
    - gem: 'puppet_litmus'
      version: '~> 2.8'
spec/spec_helper.rb:
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--arch-exclude arm'
    - '--collection-platform-exclude 9:centos-7'
    - '--collection-platform-exclude 9:redhat-7'
    - '--collection-platform-exclude 9:debian-10'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '50 2 * * *'
  acceptance_flags:
    - '--nightly'
    - '--arch-exclude arm'
    - '--collection-platform-exclude 9:centos-7'
    - '--collection-platform-exclude 9:redhat-7'
    - '--collection-platform-exclude 9:debian-10'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
Rakefile:
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - strict_indent
  - params_not_optional_with_undef
  - exec_idempotency
